[project]
name = "moribot"
version = "0.1.0"
description = "A modular AI assistant control plane inspired by AstrBot"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.15"
authors = [{ name = "an-shi" }]
keywords = ["AI", "Agent", "Chatbot", "MoriBot"]
dependencies = [
  "aiosqlite>=0.21.0",
  "fastapi>=0.115.0",
  "loguru>=0.7.3",
  "pyjwt>=2.10.1",
  "python-dotenv>=1.0.1",
  "sqlalchemy[asyncio]>=2.0.36",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[project.scripts]
moribot = "moribot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moribot"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["data", "dashboard", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "Q"]
ignore = ["E501", "ASYNC230"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
